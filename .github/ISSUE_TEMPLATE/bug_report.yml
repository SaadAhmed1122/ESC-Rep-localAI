name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ **Do not paste real company data or personal data.** Use the demo dataset or anonymised numbers. Report security issues privately (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual behaviour.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `esglocal doctor`
      render: text
  - type: input
    id: model
    attributes:
      label: Model and provider
      placeholder: "ollama / qwen2.5:7b"
  - type: input
    id: os
    attributes:
      label: OS and Python version
